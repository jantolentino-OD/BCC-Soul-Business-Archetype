<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soul-Aligned Business Archetype Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Lato:wght@400;600;700&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">
<style>
  :root {
    --plum: #5E2D6B;
    --plum-dark: #3B1C45;
    --gold: #CEA565;
    --gold-light: #E6CBA0;
    --cream: #F5F0EA;
    --sage: #B07898;
    --blush: #EAD8D8;
    --text: #3B2A3F;
    --white: #ffffff;
    --font-heading: 'Playfair Display', Georgia, serif;
    --font-body: 'Lato', Arial, sans-serif;
    --font-accent: 'Cormorant Garamond', 'Georgia', serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-heading);
    background: linear-gradient(160deg, var(--cream) 0%, var(--blush) 100%);
    color: var(--text);
    padding: 24px 16px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 28px; }
  .header .logo {
    height: 56px;
    width: auto;
    margin: 0 auto;
    display: block;
  }
  .header h1 {
    font-family: var(--font-heading);
    font-size: 30px;
    margin: 10px 0 8px;
    color: var(--plum-dark);
    font-weight: 600;
  }
  .header p {
    color: #7C5C79;
    font-family: var(--font-accent);
    font-style: italic;
    font-size: 17px;
    line-height: 1.5;
  }
  .card {
    background: var(--white);
    border-radius: 18px;
    box-shadow: 0 10px 40px rgba(91,58,94,0.12);
    padding: 36px 30px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg, var(--gold), var(--plum), var(--sage));
  }
  .progress-row {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-body);
    font-size: 13px;
    color: #9C7E96;
    margin-bottom: 8px;
  }
  .progress-bar {
    height: 6px;
    background: #F0DCE3;
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 30px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--plum));
    transition: width 0.4s ease;
  }
  .category-tag {
    display: inline-block;
    font-family: var(--font-body);
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--sage);
    font-weight: 700;
    margin-bottom: 10px;
  }
  .question {
    font-size: 23px;
    line-height: 1.4;
    color: var(--plum-dark);
    margin-bottom: 26px;
  }
  .options { display: flex; flex-direction: column; gap: 12px; }
  .option-btn {
    text-align: left;
    padding: 16px 18px;
    border: 2px solid var(--blush);
    border-radius: 12px;
    background: var(--cream);
    font-family: var(--font-body);
    font-size: 15.5px;
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .option-btn:hover {
    border-color: var(--gold);
    background: var(--gold-light);
    transform: translateY(-1px);
  }
  .nav-row {
    display: flex;
    justify-content: space-between;
    margin-top: 22px;
    font-family: var(--font-body);
  }
  .back-btn {
    background: none;
    border: none;
    color: var(--plum);
    font-size: 14px;
    cursor: pointer;
    padding: 6px 0;
  }
  .back-btn:disabled { opacity: 0; cursor: default; }

  /* Results */
  .result-header { text-align: center; margin-bottom: 26px; }
  .archetype-icon {
    width: 72px; height: 72px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold-light), var(--sage));
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
  }
  .result-header .label {
    font-family: var(--font-body);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 700;
  }
  .result-header h2 {
    font-size: 30px;
    color: var(--plum-dark);
    margin: 8px 0 12px;
    font-weight: normal;
  }
  .result-header p {
    font-family: var(--font-body);
    color: #6B4D67;
    line-height: 1.6;
    font-size: 15.5px;
    max-width: 520px;
    margin: 0 auto;
  }
  .section-title {
    font-family: var(--font-body);
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--sage);
    font-weight: 700;
    margin: 26px 0 12px;
  }
  .section-title:first-of-type { margin-top: 30px; }
  ul.result-list {
    list-style: none;
    padding: 0;
    margin: 0;
    font-family: var(--font-body);
  }
  ul.result-list li {
    padding: 10px 0 10px 26px;
    position: relative;
    color: var(--text);
    line-height: 1.5;
    border-bottom: 1px solid #F0DCE3;
    font-size: 15px;
  }
  ul.result-list li:last-child { border-bottom: none; }
  ul.result-list.strengths li::before { content: '✦'; position: absolute; left: 0; color: var(--gold); }
  ul.result-list.ideas li::before { content: '→'; position: absolute; left: 0; color: var(--plum); }
  ul.result-list.watch li::before { content: '⚠'; position: absolute; left: 0; color: var(--sage); }
  .insight-box {
    background: linear-gradient(135deg, #F3E2E8, var(--cream));
    border-radius: 14px;
    padding: 22px 24px;
    margin-top: 26px;
    font-family: var(--font-body);
  }
  .insight-box h3 {
    margin: 0 0 10px;
    font-size: 15px;
    color: var(--plum-dark);
    letter-spacing: 0.5px;
  }
  .insight-box p {
    margin: 0;
    line-height: 1.65;
    color: var(--text);
    font-size: 15px;
  }
  .breakdown {
    display: flex;
    gap: 8px;
    margin: 22px 0;
    font-family: var(--font-body);
  }
  .breakdown-item { flex: 1; text-align: center; }
  .breakdown-bar-track {
    background: #F0DCE3;
    border-radius: 6px;
    height: 60px;
    display: flex;
    align-items: flex-end;
    overflow: hidden;
  }
  .breakdown-bar-fill {
    width: 100%;
    background: var(--plum);
    border-radius: 6px 6px 0 0;
    transition: height 0.5s ease;
  }
  .breakdown-label {
    font-size: 11px;
    margin-top: 6px;
    color: #8C6D86;
  }
  .cta-row {
    display: flex;
    gap: 12px;
    margin-top: 30px;
    flex-wrap: wrap;
  }
  .btn-primary, .btn-secondary {
    font-family: var(--font-body);
    font-size: 15px;
    padding: 14px 22px;
    border-radius: 30px;
    border: none;
    cursor: pointer;
    flex: 1;
    min-width: 160px;
  }
  .btn-primary {
    background: var(--plum);
    color: white;
    font-weight: 600;
  }
  .btn-primary:hover { background: var(--plum-dark); }
  .btn-secondary {
    background: transparent;
    color: var(--plum);
    border: 2px solid var(--blush);
  }
  .btn-secondary:hover { border-color: var(--plum); }
  .footer-note {
    text-align: center;
    font-family: var(--font-body);
    font-size: 12.5px;
    color: #B49AAE;
    margin-top: 22px;
  }

  /* Tablet and up: a little more breathing room */
  @media (min-width: 600px) {
    body { padding: 40px 24px; }
    .card { padding: 44px 40px; }
    .header .logo { height: 68px; }
  }

  /* Small phones: tighten spacing and type so nothing feels cramped */
  @media (max-width: 420px) {
    .header .logo { height: 42px; }
    .header h1 { font-size: 24px; }
    .header p { font-size: 15.5px; }
    .card { padding: 26px 18px; border-radius: 14px; }
    .question { font-size: 19px; margin-bottom: 20px; }
    .option-btn { padding: 13px 14px; font-size: 14.5px; }
    .result-header .archetype-icon { width: 60px; height: 60px; font-size: 26px; }
    .result-header h2 { font-size: 24px; }
    .result-header p { font-size: 14.5px; }
    .breakdown { gap: 4px; }
    .breakdown-bar-track { height: 48px; }
    .breakdown-label { font-size: 9.5px; }
    .insight-box { padding: 18px 16px; }
    .cta-row { flex-direction: column; }
    .btn-primary, .btn-secondary { min-width: 0; }
  }
</style>
</head>

  connector: {
    title: "The Connector", emoji: "🌐",
    description: "You thrive on relationships and bringing people together. Your network and your presence in a room are real business assets — your business should be built to leverage them, not sideline them.",
    strengths: ["Natural networker with wide, genuine connections", "Ability to see synergies between people and ideas", "Skilled facilitator and communicator", "Generates energy and momentum in groups"],
    ideas: ["Community, membership, or mastermind spaces", "Event, retreat, or experience hosting", "Podcast, interview series, or collaborative media", "Partnership brokering, referral-based, or affiliate models"],
    watch: ["Overcommitting to every relationship and diluting focus", "Undercharging because the relationship feels like 'friendship'", "Avoiding solo, heads-down work that the business still needs"],
    advice: "Design your business to run through relationships — referrals, partnerships, and community — rather than cold, solo lead generation. Create platforms or gatherings that let your network compound over time. Your ideal growth engine is word of mouth, not ads."
  }
};

let currentQ = 0;
let answers = [];
const card = document.getElementById('card');

function renderQuestion() {
  const q = questions[currentQ];
  const progress = Math.round(((currentQ) / questions.length) * 100);
  card.innerHTML = `
    <div class="progress-row"><span>Question ${currentQ + 1} of ${questions.length}</span><span>${progress}%</span></div>
    <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
    <div class="category-tag">${q.category}</div>
    <div class="question">${q.question}</div>
    <div class="options">
      ${q.options.map((opt, i) => `<button class="option-btn" data-value="${opt.value}">${opt.text}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="back-btn" id="backBtn" ${currentQ === 0 ? 'disabled' : ''}>← Back</button>
      <span></span>
    </div>
  `;
  card.querySelectorAll('.option-btn').forEach(btn => {
    btn.addEventListener('click', () => selectAnswer(btn.getAttribute('data-value')));
  });
  const backBtn = document.getElementById('backBtn');
  if (backBtn) backBtn.addEventListener('click', goBack);
}

function selectAnswer(value) {
  answers[currentQ] = value;
  if (currentQ < questions.length - 1) {
    currentQ++;
    renderQuestion();
  } else {
    renderResult();
  }
}

function goBack() {
  if (currentQ > 0) {
    currentQ--;
    renderQuestion();
  }
}

function renderResult() {
  const scores = { creator: 0, healer: 0, strategist: 0, connector: 0 };
  answers.forEach(a => { scores[a] = (scores[a] || 0) + 1; });
  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const topKey = sorted[0][0];
  const arch = archetypes[topKey];
  const maxScore = Math.max(...Object.values(scores));

  card.innerHTML = `
    <div class="result-header">
      <div class="label">Your Business Archetype</div>
      <div class="archetype-icon">${arch.emoji}</div>
      <h2>${arch.title}</h2>
      <p>${arch.description}</p>
    </div>

    <div class="breakdown">
      ${Object.entries(archetypes).map(([key, a]) => {
        const val = scores[key] || 0;
        const heightPct = maxScore ? Math.max((val / maxScore) * 100, 8) : 8;
        return `
          <div class="breakdown-item">
            <div class="breakdown-bar-track"><div class="breakdown-bar-fill" style="height:${heightPct}%"></div></div>
            <div class="breakdown-label">${a.title.replace('The ','')}<br>${val}</div>
          </div>`;
      }).join('')}
    </div>

    <div class="section-title">Your Core Strengths</div>
    <ul class="result-list strengths">${arch.strengths.map(s => `<li>${s}</li>`).join('')}</ul>

    <div class="section-title">Soul-Aligned Business Directions</div>
    <ul class="result-list ideas">${arch.ideas.map(s => `<li>${s}</li>`).join('')}</ul>

    <div class="section-title">Watch Out For</div>
    <ul class="result-list watch">${arch.watch.map(s => `<li>${s}</li>`).join('')}</ul>

    <div class="insight-box">
      <h3>Key Insight for Your Business</h3>
      <p>${arch.advice}</p>
    </div>

    <div class="cta-row">
      <button class="btn-primary" id="restartBtn">Retake the Quiz</button>
    </div>
  `;
  document.getElementById('restartBtn').addEventListener('click', restart);
}

function restart() {
  currentQ = 0;
  answers = [];
  renderQuestion();
}

renderQuestion();
</script>
</body>
</html>
